[build-system]
requires = ["setuptools>=78,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "context-aware-pr-review"
version = "0.1.2a1"
description = "Local advisory review of textual unified diffs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md", "prreview/vendor/LICENSE.*.txt"]
authors = [{name = "RUSSELL PHILIP SMITHSON"}]
dependencies = []

[project.scripts]
prreview = "prreview.engine:main"

[tool.setuptools.packages.find]
include = ["prreview*"]

[tool.setuptools.package-data]
"prreview.vendor" = ["LICENSE.*.txt", "*.md"]
